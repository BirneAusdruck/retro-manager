[project]
name = "retro-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Serg", email = "sergej191198@hotmail.de" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "keyring>=25.7.0",
    "paramiko>=5.1.0",
    "py7zr>=1.1.4",
    "pyside6>=6.12.0",
]

[project.scripts]
retro-manager = "retro_manager.app:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncssh>=2.24.1",
    "pyftpdlib>=2.2.0",
    "pyopenssl>=26.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# ---------------------------------------------------------------
# Ruff & pytest (aus uv-vorlage/vorlagen/pyproject-tools.toml)
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F = Grundfehler, I = Import-Sortierung, UP = moderne Syntax, B = typische Fallen
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
